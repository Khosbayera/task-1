name: Checkout Demo with Action
on: [push]

jobs:
  checkout_and_display_files:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ List files before checkout
      - name: List Files Before Checkout
        run: ls -la

      # 2️⃣ Checkout repository using official action
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 3️⃣ List files after checkout
      - name: List Files After Checkout
        run: ls -la

      # 4️⃣ Show current branch
      - name: Show Current Branch
        run: git branch

      # 5️⃣ Show latest commit
      - name: Show Latest Commit
        run: git log -1 --oneline
