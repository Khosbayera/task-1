name: Checkout
on: [push]

jobs:
  checkout_and_display_files:
    runs-on: ubuntu-latest
    env:
      GITHUB_ACTOR_ENV: ${{ github.actor }}
      GITHUB_TOKEN_ENV: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: List Files Before Checkout
        run: ls -la

      - name: Checkout Repository Manually
        run: |
          git init
          git remote add origin https://$GITHUB_ACTOR_ENV:$GITHUB_TOKEN_ENV@github.com/$GITHUB_REPOSITORY.git
          git fetch origin
          git checkout main

      - name: List Files After Checkout
        run: ls -la
