name: Matrix Strategy 
on: [push]

jobs:
    node-matrix:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [12, 14, 16]
        steps:
            - run: node -v
            - uses: actions/checkout@v3
            with:
                node-version: ${{ matrix['node-version'] }}
            - run: node -v