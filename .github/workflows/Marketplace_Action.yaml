\name: Marketplace Action Outputs Demo
on:
  push:

jobs:
  marketplace-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Run github-script to produce outputs
        id: gen
        uses: actions/github-script@v6
        with:
          script: |
            // produce a simple JSON result
            return {summary: Repo: ${process.env.GITHUB_REPOSITORY}, sha: process.env.GITHUB_SHA}

      - name: Append outputs to summary file
        run: |
          echo "Summary: ${{ steps.gen.outputs.result }}" >> action-summary.txt
          echo "Parsed summary field:" >> action-summary.txt
          echo "$(echo '${{ steps.gen.outputs.result }}' | jq -r '.summary')" >> action-summary.txt
          echo "SHA: $(echo '${{ steps.gen.outputs.result }}' | jq -r '.sha')" >> action-summary.txt

      - name: Upload summary artifact
        uses: actions/upload-artifact@v4
        with:
          name: action-summary
          path: action-summary.txt