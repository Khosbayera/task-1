name: Expressions & Contexts 
on: [push, pull_request, issues]
run-name: "Expression & Contexts - ${{ github.actor }} , event: ${{ github.event_name }}"

jobs:
    using-expressions-and-events:
        runs-on: ubuntu-latest
        steps:
            - name: Expressions
            id: expressions
            run: |
                echo ${{ 1 }}
                echo ${{ 'This is a string'}}
                echo ${{ true }}
                echo ${{ false }}
                echo ${{ null }}
                echo ${{ 1 > 2 }}
                echo ${{ 'string' == 'String' }}
                echo ${{ 1 && 0 }}
                echo ${{ true || (false && true) }}
            - name: Dump Contexts 
            run: |
                echo ${{ toJson(github) }}
                echo ${{ toJson(job) }}
                echo ${{ toJson(steps) }}
                echo ${{ toJson(runner) }}
                echo ${{ toJson(secrets) }}~