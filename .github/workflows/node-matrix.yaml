name: Node.js Multi-OS Matrix

on:
  push:

jobs:
  node_matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [16, 18, 20]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node }}

      - name: Print Node.js and OS info
        run: |
          echo "Running on OS: $RUNNER_OS"
          node -v
          npm -v
          uname -a || systeminfo

      - name: Main branch only step
        if: github.ref == 'refs/heads/main'
        run: echo "This runs only on the main branch"

      - name: Step if previous failed
        if: failure()
        run: echo "Previous step failed!"

      - name: Always runs step
        if: always()
        run: echo "This step always runs"

      - name: Capture Git info
        run: |
          echo "Commit SHA: $GITHUB_SHA" > info.txt
          echo "Repository: $GITHUB_REPOSITORY" >> info.txt
          echo "Workspace Path: $GITHUB_WORKSPACE" >> info.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-matrix-info-${{ matrix.os }}-node${{ matrix.node }}
          path: info.txt
