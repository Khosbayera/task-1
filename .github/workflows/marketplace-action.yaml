name: Marketplace Action with Outputs
on: [push]

jobs:
  use-marketplace-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: script
        uses: actions/github-script@v7
        with:
          script: |
            const msg = `Run by ${context.actor} on event ${context.eventName}`;
            core.setOutput('custom_message', msg);

      - name: Append output to summary file
        run: |
          echo "Action Output Summary:" >> summary.txt
          echo "Custom Message: ${{ steps.script.outputs.custom_message }}" >> summary.txt
          echo "------------------------" >> summary.txt

      - uses: actions/upload-artifact@v4
        with:
          name: action-summary
          path: summary.txt
