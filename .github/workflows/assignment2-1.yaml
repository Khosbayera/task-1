name: Multi-OS System Info

on:
  push:

jobs:
  ubuntu_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Print system information
        run: |
          echo "Running on Ubuntu"
          uname -a
          lsb_release -a || true

      # Conditional step: only runs on main branch
      - name: Main branch only step
        if: github.ref == 'refs/heads/main'
        run: echo "This runs only on the main branch"

      # Conditional step: only runs if previous step fails
      - name: Run if previous step fails
        if: failure()
        run: echo "The previous step failed!"

      # Conditional step: always runs
      - name: Always runs step
        if: always()
        run: echo "This step always runs regardless of previous step outcome"

      - name: Capture Git info
        run: |
          echo "Commit SHA: $GITHUB_SHA" > info.txt
          echo "Repository: $GITHUB_REPOSITORY" >> info.txt
          echo "Workspace Path: $GITHUB_WORKSPACE" >> info.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-info
          path: info.txt

  macos_job:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Print system information
        run: |
          echo "Running on macOS"
          sw_vers
          uname -a

      # Conditional steps
      - name: Main branch only step
        if: github.ref == 'refs/heads/main'
        run: echo "This runs only on the main branch"

      - name: Run if previous step fails
        if: failure()
        run: echo "The previous step failed!"

      - name: Always runs step
        if: always()
        run: echo "This step always runs regardless of previous step outcome"

      - name: Capture Git info
        run: |
          echo "Commit SHA: $GITHUB_SHA" > info.txt
          echo "Repository: $GITHUB_REPOSITORY" >> info.txt
          echo "Workspace Path: $GITHUB_WORKSPACE" >> info.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-info
          path: info.txt

  windows_job:
    runs-on: windows-latest
    if: always()  # Windows always runs even if Ubuntu/macOS fails
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Print system information
        run: |
          echo "Running on Windows"
          systeminfo

      # Conditional steps
      - name: Main branch only step
        if: github.ref == 'refs/heads/main'
        run: echo "This runs only on the main branch"

      - name: Run if previous step fails
        if: failure()
        run: echo "The previous step failed!"

      - name: Always runs step
        if: always()
        run: echo "This step always runs regardless of previous step outcome"

      - name: Capture Git info
        run: |
          echo Commit SHA: %GITHUB_SHA% > info.txt
          echo Repository: %GITHUB_REPOSITORY% >> info.txt
          echo Workspace Path: %GITHUB_WORKSPACE% >> info.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-info
          path: info.txt
